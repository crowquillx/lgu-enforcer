services:
  bot:
    image: ghcr.io/crowquillx/lgu-enforcer:latest
    container_name: discord-bot
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
    healthcheck:
      # Bot has no HTTP server; verify the welcome image is present in the image.
      test: ["CMD", "node", "-e", "require('fs').accessSync('resources/MIMLSSK.png'); process.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
